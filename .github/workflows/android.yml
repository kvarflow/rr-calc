name: Android app
# Builds RR Calc for Android (android/build.sh) whenever the app changes, and puts it on the
# "android-latest" release, so the Thor can download it from
# https://github.com/kvarflow/rr-calc/releases/download/android-latest/rr-calc.apk
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The signing key, from the repo's secrets when it has one (ANDROID_KEYSTORE_BASE64: a .p12
      # keystore in base64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS), so each build installs
      # over the last; without it build.sh signs with a throwaway key.
      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12" ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" ANDROID_KEY_ALIAS="$KEY_ALIAS"
          fi
          bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rr-calc-apk
          path: android/build/rr-calc.apk
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="RR Calc for Android, build ${{ github.run_number }} from ${GITHUB_SHA::7}. Install rr-calc.apk on the Thor (allow installs from your browser or file manager); a newer build installs over it and keeps your data when it is signed with the same key."
          if gh release view android-latest > /dev/null 2>&1; then
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest --title "RR Calc for Android" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload android-latest android/build/rr-calc.apk --clobber
